<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var savedTheme = localStorage.getItem('portfolio-theme');
        document.documentElement.dataset.theme = savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (_) { document.documentElement.dataset.theme = 'light'; }
    </script>

    <!-- 1. Cookie consent (CookieHub) + GA4, loaded AFTER the page is usable.
         As a synchronous head script this blocked first paint for ~1.3 s; as a
         `defer` script it still executed ahead of the app's module script and
         pushed the entire React render out behind a third-party CDN. Consent
         does not need to precede the first paint, and GA4 is only requested
         once consent is granted, so the loader is injected asynchronously on
         the `load` event instead. -->
    <script type="text/javascript">
      function loadGA4() {
        if (window.ga4Loaded) return;
        window.ga4Loaded = true;

        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-R767831ZBS';
        document.head.appendChild(script);

        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', 'G-R767831ZBS');
      }

      (function initConsent() {
        function start() {
          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://cdn.cookiehub.eu/c2/c71950bb.js';
          script.onload = function () {
            window.cookiehub.load({
              onInitialise: function () {
                if (this.hasConsented('analytics')) loadGA4();
              },
              onAllow: function (category) {
                if (category === 'analytics') loadGA4();
              },
            });
          };
          document.head.appendChild(script);
        }

        if (document.readyState === 'complete') start();
        else window.addEventListener('load', start, { once: true });
      })();
    </script>

    <!-- Browser tab title + every crawler-facing value.
         These are NOT literals: they are injected at build time from
         src/data/positioning.js + src/data/seo.js by the `positioningHtml`
         plugin in vite.config.js, so <title>, the meta description, the OG
         card and the JSON-LD all carry the ONE positioning statement and can
         never drift from the copy the site renders. (T-014 — gate FAILs #7/#10.)
         A placeholder left unreplaced fails the build on purpose. -->
    <title>%POSITIONING_TITLE%</title>
    <link rel="canonical" href="%CANONICAL_URL%" />

    <!-- SEO Meta Tags -->
    <meta name="description" content="%POSITIONING_META_DESCRIPTION%" />
    <meta name="robots" content="index,follow,max-image-preview:large" />

    <!-- Social card. og:image / og:url are absolute: a scraper resolves nothing. -->
    <meta property="og:type" content="%OG_TYPE%" />
    <meta property="og:site_name" content="Sheersh Tiwari" />
    <meta property="og:title" content="%POSITIONING_TITLE%" />
    <meta property="og:description" content="%POSITIONING_META_DESCRIPTION%" />
    <meta property="og:url" content="%CANONICAL_URL%" />
    <meta property="og:image" content="%OG_IMAGE_URL%" />
    <meta property="og:image:width" content="%OG_IMAGE_WIDTH%" />
    <meta property="og:image:height" content="%OG_IMAGE_HEIGHT%" />
    <meta property="og:image:alt" content="%OG_IMAGE_ALT%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%POSITIONING_TITLE%" />
    <meta name="twitter:description" content="%POSITIONING_META_DESCRIPTION%" />
    <meta name="twitter:image" content="%OG_IMAGE_URL%" />
    <meta name="twitter:image:alt" content="%OG_IMAGE_ALT%" />
    <script type="application/ld+json">%JSON_LD%</script>

    <!-- Personal flow mark, shared with the portfolio wordmark. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/brand-mark.svg"
    />

    <!-- Fonts — loaded non-blocking: a render-blocking Google Fonts stylesheet
         was costing ~1.3 s of first paint. Text paints immediately in the
         fallback face (font-display: swap) and swaps in when the CSS lands. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
    <link
      id="font-stylesheet"
      rel="stylesheet"
      media="print"
      onload="this.media='all';this.removeAttribute('onload')"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      />
    </noscript>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-orange-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
