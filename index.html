<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 1. CookieHub Cookie Banner Script with GA4 Integration Callback -->
    <script src="https://cdn.cookiehub.eu/c2/c71950bb.js"></script>
    <script type="text/javascript">
      document.addEventListener("DOMContentLoaded", function(event) {
        var cpm = {
          onInitialise: function(status) {
            if (this.hasConsented('analytics')) {
              loadGA4();
            }
          },
          onAllow: function(category) {
            if (category === 'analytics') {
              loadGA4();
            }
          }
        };
        window.cookiehub.load(cpm);
      });

      function loadGA4() {
        if (window.ga4Loaded) return;
        window.ga4Loaded = true;

        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-R767831ZBS';
        document.head.appendChild(script);

        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', 'G-R767831ZBS');
      }
    </script>

    <!-- Browser Tab Title -->
    <title>Portfolio | Sheersh.dev</title>

    <!-- Custom Tech Graphic Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230f172a'/><path d='M30 35L15 50L30 65M70 35L85 50L70 65M55 30L45 70' stroke='%23a855f7' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/></svg>"
    />

    <!-- SEO Meta Tags -->
    <meta

    />

    <!-- Fonts -->

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
