name: Automated AI Lead Hunter Pipeline

on:
  push:
    branches: [main] # Runs immediately when you commit/deploy
  schedule:
    - cron: '0 9 * * *' # Runs automatically once every day at 09:00 UTC
  workflow_dispatch: # Allows manual triggers anytime

concurrency:
  group: lead-hunter-pipeline
  cancel-in-progress: true

jobs:
  execute-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute Lead Hunter Script
        run: node scripts/lead-hunter.js
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL: 'er.sheershtiwari@gmail.com'
